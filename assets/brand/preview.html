<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musimob — bộ logo</title>
<style>
  *{box-sizing:border-box}body{margin:0;padding:40px;background:#18181b;color:#f4f4f5;font:16px/1.5 system-ui,sans-serif}main{max-width:1120px;margin:auto}h1{font-size:36px;margin:0}p{color:#a1a1aa;margin:8px 0 28px}h2{font-size:16px;margin:0 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{padding:24px;border:1px solid #3f3f46;border-radius:16px;min-width:0;background:#0a0a0b}.light{background:#f4f4f5;color:#0a0a0b}.logo{display:block;width:100%;height:130px;object-fit:contain}.symbols{display:flex;gap:20px;align-items:center;justify-content:center}.symbols img{width:110px;height:110px}.icons{display:flex;gap:24px;align-items:end;flex-wrap:wrap}.icons figure{margin:0;text-align:center}.icons img{display:block;margin:auto}.icons figcaption{font-size:12px;margin-top:12px;color:#a1a1aa}.wide{grid-column:1/-1}.mask{width:150px;height:150px;border-radius:50%;overflow:hidden}.mask img{width:100%;height:100%}.squircle{border-radius:30%}.swatches{display:flex;gap:12px;flex-wrap:wrap}.swatches span{padding:12px 20px;border-radius:8px}@media(max-width:640px){body{padding:20px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.symbols img{width:80px;height:80px}}
</style>
<main>
  <h1>Musimob / Bộ logo</h1>
  <p>Hướng A · Bìa đĩa + m · SVG outline, lockup và icon web</p>
  <div class="grid">
    <section><h2>Logo ngang / nền tối</h2><img class="logo" src="logo-horizontal.svg" alt="Logo Musimob trên nền tối"></section>
    <section class="light"><h2>Logo ngang / nền sáng</h2><img class="logo" src="logo-horizontal-light.svg" alt="Logo Musimob trên nền sáng"></section>
    <section><h2>Biểu tượng màu và đơn sắc</h2><div class="symbols"><img src="symbol.svg" alt="Biểu tượng màu"><img src="symbol-white.svg" alt="Biểu tượng trắng"><img src="symbol-coral.svg" alt="Biểu tượng coral"></div></section>
    <section class="light"><h2>Logo dọc / nền sáng</h2><img class="logo" style="height:150px" src="logo-stacked-light.svg" alt="Logo dọc"></section>
    <section class="wide"><h2>Icon / kích thước thật</h2><div class="icons">
      <figure><img src="../../public/favicon-16x16.png" width="16" height="16" alt="Favicon 16"><figcaption>16 px</figcaption></figure>
      <figure><img src="../../public/favicon-32x32.png" width="32" height="32" alt="Favicon 32"><figcaption>32 px</figcaption></figure>
      <figure><img src="../../public/favicon-48x48.png" width="48" height="48" alt="Favicon 48"><figcaption>48 px</figcaption></figure>
      <figure><img src="../../public/icon-192.png" width="96" height="96" alt="Icon app"><figcaption>PWA</figcaption></figure>
      <figure><img src="../../public/apple-touch-icon.png" width="150" height="150" style="border-radius:33px" alt="Apple Touch Icon"><figcaption>Apple Touch</figcaption></figure>
      <figure><div class="mask"><img src="../../public/icon-maskable-512.png" alt="Maskable cắt tròn"></div><figcaption>Maskable / tròn</figcaption></figure>
      <figure><div class="mask squircle"><img src="../../public/icon-maskable-512.png" alt="Maskable bo góc"></div><figcaption>Maskable / bo góc</figcaption></figure>
    </div></section>
    <section class="wide"><h2>Bảng màu</h2><div class="swatches"><span style="background:#ff6a4d;color:#0a0a0b">Coral #ff6a4d</span><span style="background:#0a0a0b;border:1px solid #3f3f46">Than #0a0a0b</span><span style="background:#f4f4f5;color:#0a0a0b">Trắng #f4f4f5</span></div></section>
  </div>
</main>
</html>
