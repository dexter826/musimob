<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — Bố cục Musimob</title>
<!--
  PROTOTYPE — không phải production.
  Câu hỏi: màn hình danh sách trông thế nào, và thêm một bài diễn ra ra sao?
  Ba variant cấu trúc khác nhau, đổi bằng ?variant=A|B|C
  Trạng thái rỗng: ?empty=1
  Mở bằng cách double-click file này.
-->
<style>
  :root {
    --bg: #0a0a0b;
    --surface: #131316;
    --surface-2: #1c1c20;
    --line: #2a2a30;
    --text: #f4f4f5;
    --muted: #8f8f9a;
    --accent: #ff6a4d;
    --ok: #c8f560;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #050506;
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 96px;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }
  img { display: block; }

  .shell {
    max-width: 520px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
    overflow-x: hidden;
  }

  /* ---------- Variant A: dense rows + modal ---------- */
  .a-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px 12px;
  }
  .a-word { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
  .a-word span { color: var(--accent); }
  .a-avatar {
    width: 30px; height: 30px; border-radius: 999px;
    background: linear-gradient(140deg, #ff6a4d, #a1312a);
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
  }
  .a-search { padding: 0 20px 14px; }
  .a-search input {
    width: 100%; padding: 11px 14px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--line);
    outline: none; font-size: 14px;
  }
  .a-search input:focus { border-color: #3f3f48; }
  .a-list { padding: 0 12px 24px; }
  .a-row {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 8px; border-radius: 10px;
  }
  .a-row:hover { background: var(--surface); }
  .a-row img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; background: var(--surface-2); }
  .a-meta { min-width: 0; flex: 1; }
  .a-title { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .a-artist { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .a-count { padding: 2px 20px 10px; font-size: 12px; color: var(--muted); }
  .a-fab {
    position: sticky; bottom: 24px; margin-left: auto; margin-right: 20px;
    width: 52px; height: 52px; border-radius: 999px;
    background: var(--accent); color: #1a0a06;
    display: grid; place-items: center; font-size: 26px; font-weight: 500;
    box-shadow: 0 10px 30px rgba(255,106,77,.3);
  }
  .a-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: grid; place-items: center; padding: 20px;
  }
  .a-modal {
    width: 100%; max-width: 460px; max-height: 78vh;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
  }
  .a-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; }
  .a-modal-head h2 { margin: 0; font-size: 15px; }
  .a-modal-body { padding: 0 18px 18px; overflow: auto; }
  .a-tabs { display: flex; gap: 6px; padding: 0 18px 12px; }
  .a-tab { padding: 6px 12px; border-radius: 999px; font-size: 12.5px; color: var(--muted); border: 1px solid transparent; }
  .a-tab[data-on="1"] { background: var(--surface-2); color: var(--text); border-color: var(--line); }
  .a-result { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .a-result img { width: 40px; height: 40px; border-radius: 5px; object-fit: cover; }
  .a-add {
    margin-left: auto; font-size: 12px; font-weight: 600;
    padding: 6px 10px; border-radius: 999px; background: var(--surface-2);
  }
  .a-add[data-saved="1"] { color: var(--ok); background: transparent; }
  .a-savednote { padding: 10px 0; color: var(--muted); font-size: 12.5px; }

  /* ---------- Variant B: cover grid + bottom sheet ---------- */
  .b-head { padding: 24px 20px 8px; }
  .b-head h1 { margin: 0; font-size: 30px; letter-spacing: -0.035em; line-height: 1.05; }
  .b-head p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .b-search { padding: 12px 20px 16px; }
  .b-search input {
    width: 100%; padding: 12px 16px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line); outline: none; font-size: 13.5px;
  }
  .b-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px 90px; }
  .b-card { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 1; background: var(--surface-2); }
  .b-card img { width: 100%; height: 100%; object-fit: cover; }
  .b-card .b-shade {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.15) 46%, transparent 70%);
  }
  .b-card .b-cap { position: absolute; left: 10px; right: 10px; bottom: 9px; }
  .b-card .b-t { font-size: 12.5px; font-weight: 600; line-height: 1.25; }
  .b-card .b-a { font-size: 11px; color: rgba(255,255,255,.66); margin-top: 2px; }
  .b-sheet {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 0; width: 100%; max-width: 520px;
    background: var(--surface); border-top-left-radius: 20px; border-top-right-radius: 20px;
    border: 1px solid var(--line); border-bottom: 0;
    max-height: 82vh; display: flex; flex-direction: column;
    box-shadow: 0 -20px 50px rgba(0,0,0,.5);
  }
  .b-handle { width: 38px; height: 4px; border-radius: 999px; background: #3a3a42; margin: 10px auto 4px; }
  .b-sheet-head { padding: 6px 20px 12px; }
  .b-sheet-head h2 { margin: 0; font-size: 16px; }
  .b-sheet-head p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
  .b-sheet-body { padding: 0 20px 28px; overflow: auto; }
  .b-tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .b-tab { padding: 10px 0; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; }
  .b-tab[data-on="1"] { color: var(--text); border-bottom-color: var(--accent); }
  .b-result { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
  .b-result img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; }
  .b-add { margin-left: auto; font-size: 11.5px; font-weight: 600; padding: 7px 12px; border-radius: 999px; background: var(--accent); color: #1a0a06; }

  /* ---------- Variant C: typographic, inline add ---------- */
  .c-wrap { padding: 34px 24px 40px; }
  .c-kicker { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .c-wrap h1 { margin: 10px 0 22px; font-size: 34px; line-height: 1.02; letter-spacing: -0.045em; font-weight: 700; }
  .c-filter {
    width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line);
    padding: 9px 0; font-size: 14px; outline: none; margin-bottom: 8px;
  }
  .c-filter::placeholder { color: #5c5c66; }
  .c-item { padding: 15px 0; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 12px; }
  .c-item .c-num { font-size: 11px; color: #4e4e57; font-variant-numeric: tabular-nums; min-width: 18px; }
  .c-item .c-t { font-size: 18px; letter-spacing: -0.02em; line-height: 1.2; }
  .c-item .c-a { font-size: 11.5px; color: var(--muted); margin-top: 4px; letter-spacing: .01em; }
  .c-inline { padding: 18px 0 0; }
  .c-addbtn {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: var(--accent); font-weight: 600;
  }
  .c-addbox { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--surface); }
  .c-addbox input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 6px 0 10px; outline: none; font-size: 14px; }
  .c-res { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .c-res img { width: 36px; height: 36px; border-radius: 4px; object-fit: cover; }
  .c-res .c-rt { font-size: 13.5px; }
  .c-res .c-ra { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .c-save { margin-left: auto; font-size: 11px; color: var(--accent); font-weight: 600; }

  /* ---------- empty state ---------- */
  .empty { padding: 60px 24px; text-align: center; }
  .empty .e-big { font-size: 22px; letter-spacing: -0.02em; font-weight: 600; }
  .empty p { color: var(--muted); font-size: 13.5px; line-height: 1.55; margin: 10px auto 0; max-width: 260px; }
  .empty .e-btn {
    margin-top: 22px; padding: 11px 20px; border-radius: 999px;
    background: var(--accent); color: #1a0a06; font-size: 13px; font-weight: 600;
  }

  /* ---------- floating switcher (not part of the design) ---------- */
  .switcher {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 22px; z-index: 100;
    display: flex; align-items: center; gap: 8px;
    background: #f4f4f5; color: #0a0a0b;
    border-radius: 999px; padding: 6px 8px;
    box-shadow: 0 12px 40px rgba(0,0,0,.6);
    font-size: 12px; font-weight: 600;
  }
  .switcher button { color: #0a0a0b; width: 26px; height: 26px; border-radius: 999px; display: grid; place-items: center; }
  .switcher button:hover { background: rgba(0,0,0,.08); }
  .switcher .lbl { min-width: 128px; text-align: center; letter-spacing: -0.01em; }
  .switcher .tag { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; opacity: .45; padding-right: 4px; }
  .switcher .sep { width: 1px; height: 18px; background: rgba(0,0,0,.14); }
</style>
</head>
<body>
<div class="shell" id="app"></div>

<div class="switcher">
  <span class="tag">prototype</span>
  <button id="prev" title="Variant trước">←</button>
  <span class="lbl" id="lbl">A</span>
  <button id="next" title="Variant sau">→</button>
  <span class="sep"></span>
  <button id="emptyToggle" title="Bật/tắt trạng thái rỗng" style="width:auto;padding:0 10px;font-size:11px">Rỗng</button>
</div>

<script>
const SONGS = [
  { t: 'Đừng Làm Trái Tim Anh Đau', a: 'Sơn Tùng M-TP', c: 'https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/e3/0b/38/e30b383e-5818-321a-7626-557b7b0f8ba3/24UMGIM61359.rgb.jpg/600x600bb.jpg' },
  { t: 'Dynamite', a: 'BTS', c: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/22/f3/8f/22f38fb9-1690-326a-d891-7aa946c2b06f/195497623273_Cover.jpg/600x600bb.jpg' },
  { t: 'Bohemian Rhapsody', a: 'Queen', c: 'https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/15/c7/55/15c755bc-7603-3ce3-e243-e59f1f9863ea/602527724171.jpg/600x600bb.jpg' },
  { t: 'Buông Đôi Tay Nhau Ra', a: 'Sơn Tùng M-TP', c: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/63/1b/1a/631b1a1d-f87c-2864-1b9f-47ffd625e33f/23UM1IM10806.rgb.jpg/600x600bb.jpg' },
  { t: 'Come My Way', a: 'Sơn Tùng M-TP & Tyga', c: 'https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/fb/8d/17/fb8d17ce-e565-7106-db5f-f1f50eccc347/823375188872_Cover.jpg/600x600bb.jpg' },
];

const NAMES = { A: 'Danh sách dày', B: 'Lưới ảnh bìa', C: 'Chữ là chính', D: 'Trộn A + B' };

const p = new URLSearchParams(location.search);
let variant = (p.get('variant') || 'A').toUpperCase();
if (!NAMES[variant]) variant = 'A';
let empty = p.get('empty') === '1';
let sheet = false;
let addTab = 'itunes';
let query = '';
let viewMode = 'list';

const esc = s => s.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const visible = () => SONGS.filter(s =>
  (s.t + ' ' + s.a).toLowerCase().includes(query.toLowerCase().trim())
);

function emptyBlock() {
  return `<div class="empty">
    <div class="e-big">Chưa có bài nào</div>
    <p>Thêm bài đầu tiên để bắt đầu danh sách của bạn.</p>
    <button class="e-btn" onclick="openAdd()">Thêm bài đầu tiên</button>
  </div>`;
}

/* ---------- A ---------- */
function renderA() {
  const list = visible();
  return `
  <div class="a-top">
    <div class="a-word">musi<span>mob</span></div>
    <div class="a-avatar">MT</div>
  </div>
  <div class="a-search"><input id="q" placeholder="Tìm trong danh sách" value="${esc(query)}"></div>
  <div class="a-count">${list.length} bài</div>
  ${empty ? emptyBlock() : `<div class="a-list">${list.map(s => `
    <div class="a-row">
      <img src="${s.c}" alt="">
      <div class="a-meta">
        <div class="a-title">${esc(s.t)}</div>
        <div class="a-artist">${esc(s.a)}</div>
      </div>
    </div>`).join('')}</div>
    <div style="display:flex;padding:0 4px"><button class="a-fab" onclick="openAdd()">+</button></div>`}
  ${sheet ? `
  <div class="a-overlay" onclick="if(event.target===this)closeAdd()">
    <div class="a-modal">
      <div class="a-modal-head">
        <h2>Thêm bài</h2>
        <button onclick="closeAdd()" style="color:#8f8f9a;font-size:18px">✕</button>
      </div>
      <div class="a-tabs">
        <button class="a-tab" data-on="${addTab==='itunes'?1:0}" onclick="setTab('itunes')">Tìm trên iTunes</button>
        <button class="a-tab" data-on="${addTab==='manual'?1:0}" onclick="setTab('manual')">Nhập tay</button>
      </div>
      <div class="a-modal-body">
        ${addTab === 'itunes' ? `
          <input id="qq" placeholder="Tên bài hoặc ca sĩ" value="${esc(query)}"
            style="width:100%;padding:10px 12px;border-radius:9px;background:#1c1c20;border:1px solid #2a2a30;outline:none;font-size:14px;margin-bottom:6px">
          <div class="a-savednote">Kết quả từ iTunes · country=vn</div>
          ${SONGS.slice(0,3).map(s => `
            <div class="a-result">
              <img src="${s.c}" alt="">
              <div class="a-meta"><div class="a-title">${esc(s.t)}</div><div class="a-artist">${esc(s.a)}</div></div>
              <button class="a-add" data-saved="${SONGS.indexOf(s) < 2 ? 1 : 0}">${SONGS.indexOf(s) < 2 ? 'Đã lưu' : 'Lưu'}</button>
            </div>`).join('')}
        ` : `
          <div class="a-savednote">Tự nhập khi iTunes không có bài.</div>
          <input placeholder="Tên bài" style="width:100%;padding:10px 12px;border-radius:9px;background:#1c1c20;border:1px solid #2a2a30;outline:none;font-size:14px;margin-bottom:8px">
          <input placeholder="Ca sĩ" style="width:100%;padding:10px 12px;border-radius:9px;background:#1c1c20;border:1px solid #2a2a30;outline:none;font-size:14px;margin-bottom:8px">
          <input placeholder="URL ảnh bìa (không bắt buộc)" style="width:100%;padding:10px 12px;border-radius:9px;background:#1c1c20;border:1px solid #2a2a30;outline:none;font-size:14px">
          <button style="margin-top:14px;width:100%;padding:11px;border-radius:9px;background:#ff6a4d;color:#1a0a06;font-weight:600;font-size:13px">Lưu bài</button>
        `}
      </div>
    </div>
  </div>` : ''}`;
}

/* ---------- B ---------- */
function renderB() {
  const list = visible();
  return `
  <div class="b-head">
    <h1>Bài của tôi</h1>
    <p>${list.length} bài</p>
  </div>
  <div class="b-search"><input id="q" placeholder="Tìm bài, ca sĩ…" value="${esc(query)}"></div>
  ${empty ? emptyBlock() : `
  <div class="b-grid">
    ${list.map(s => `
      <div class="b-card">
        <img src="${s.c}" alt="">
        <div class="b-shade"></div>
        <div class="b-cap"><div class="b-t">${esc(s.t)}</div><div class="b-a">${esc(s.a)}</div></div>
      </div>`).join('')}
  </div>
  <div style="position:fixed;left:50%;transform:translateX(-50%);bottom:100px;width:100%;max-width:520px;display:flex;justify-content:flex-end;padding:0 20px;pointer-events:none">
    <button onclick="openAdd()" style="pointer-events:auto;width:52px;height:52px;border-radius:999px;background:#ff6a4d;color:#1a0a06;font-size:26px;box-shadow:0 10px 30px rgba(255,106,77,.3)">+</button>
  </div>`}
  ${sheet ? `
  <div class="b-sheet">
    <div class="b-handle"></div>
    <div class="b-sheet-head">
      <h2>Thêm bài</h2>
      <p>Chọn từ iTunes hoặc tự nhập</p>
    </div>
    <div class="b-sheet-body">
      <div class="b-tabs">
        <button class="b-tab" data-on="${addTab==='itunes'?1:0}" onclick="setTab('itunes')">iTunes</button>
        <button class="b-tab" data-on="${addTab==='manual'?1:0}" onclick="setTab('manual')">Nhập tay</button>
      </div>
      ${addTab === 'itunes' ? `
        <input id="qq" placeholder="Tìm bài hát" value="${esc(query)}"
          style="width:100%;padding:11px 14px;border-radius:999px;background:#1c1c20;border:1px solid #2a2a30;outline:none;font-size:13.5px;margin-bottom:8px">
        ${SONGS.map(s => `
          <div class="b-result">
            <img src="${s.c}" alt="">
            <div class="a-meta"><div class="a-title">${esc(s.t)}</div><div class="a-artist">${esc(s.a)}</div></div>
            <button class="b-add">Lưu</button>
          </div>`).join('')}
      ` : `
        <input placeholder="Tên bài" style="width:100%;padding:11px 14px;border-radius:10px;background:#1c1c20;border:1px solid #2a2a30;outline:none;font-size:14px;margin-bottom:8px">
        <input placeholder="Ca sĩ" style="width:100%;padding:11px 14px;border-radius:10px;background:#1c1c20;border:1px solid #2a2a30;outline:none;font-size:14px;margin-bottom:8px">
        <input placeholder="URL ảnh bìa" style="width:100%;padding:11px 14px;border-radius:10px;background:#1c1c20;border:1px solid #2a2a30;outline:none;font-size:14px">
        <button style="margin-top:14px;width:100%;padding:12px;border-radius:10px;background:#ff6a4d;color:#1a0a06;font-weight:600;font-size:13px">Lưu bài</button>
      `}
    </div>
  </div>` : ''}`;
}

/* ---------- C ---------- */
function renderC() {
  const list = visible();
  return `
  <div class="c-wrap">
    <div class="c-kicker">Musimob</div>
    <h1>Bài hát<br>của tôi</h1>
    <input class="c-filter" id="q" placeholder="Lọc theo tên…" value="${esc(query)}">
    ${empty ? emptyBlock() : `
      ${list.map((s, i) => `
        <div class="c-item">
          <div class="c-num">${String(i+1).padStart(2,'0')}</div>
          <div><div class="c-t">${esc(s.t)}</div><div class="c-a">${esc(s.a)}</div></div>
        </div>`).join('')}
      <div class="c-inline">
        ${sheet ? `
          <div class="c-addbox">
            <div class="b-tabs">
              <button class="b-tab" data-on="${addTab==='itunes'?1:0}" onclick="setTab('itunes')">iTunes</button>
              <button class="b-tab" data-on="${addTab==='manual'?1:0}" onclick="setTab('manual')">Nhập tay</button>
            </div>
            ${addTab === 'itunes' ? `
              <input id="qq" placeholder="Tìm trên iTunes" value="${esc(query)}">
              ${SONGS.slice(0,3).map(s => `
                <div class="c-res">
                  <img src="${s.c}" alt="">
                  <div><div class="c-rt">${esc(s.t)}</div><div class="c-ra">${esc(s.a)}</div></div>
                  <button class="c-save">Lưu</button>
                </div>`).join('')}
            ` : `
              <input placeholder="Tên bài">
              <input placeholder="Ca sĩ" style="margin-top:8px">
              <input placeholder="URL ảnh bìa" style="margin-top:8px">
              <button style="margin-top:12px;width:100%;padding:11px;border-radius:9px;background:#ff6a4d;color:#1a0a06;font-weight:600;font-size:13px">Lưu bài</button>
            `}
          </div>
          <div style="margin-top:14px"><button class="c-addbtn" onclick="closeAdd()">Đóng</button></div>
        ` : `
          <button class="c-addbtn" onclick="openAdd()">+ Thêm bài</button>
        `}
      </div>`}
  </div>`;
}

/* ---------- D: trộn A + B ---------- */
function renderD() {
  const list = visible();
  const rows = viewMode === 'list'
    ? `<div class="a-list">${list.map(s => `
        <div class="a-row">
          <img src="${s.c}" alt="">
          <div class="a-meta">
            <div class="a-title">${esc(s.t)}</div>
            <div class="a-artist">${esc(s.a)}</div>
          </div>
        </div>`).join('')}</div>`
    : `<div class="b-grid" style="padding:0 16px 90px">${list.map(s => `
        <div class="b-card">
          <img src="${s.c}" alt="">
          <div class="b-shade"></div>
          <div class="b-cap"><div class="b-t">${esc(s.t)}</div><div class="b-a">${esc(s.a)}</div></div>
        </div>`).join('')}</div>`;

  return `
  <div class="a-top">
    <div>
      <div class="a-word">musi<span>mob</span></div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:3px">${list.length} bài</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <button onclick="toggleView()" title="Đổi kiểu xem"
        style="width:34px;height:34px;border-radius:9px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:14px">${viewMode === 'list' ? '▦' : '☰'}</button>
      <div class="a-avatar">MT</div>
    </div>
  </div>
  <div class="a-search"><input id="q" placeholder="Tìm trong danh sách" value="${esc(query)}"></div>
  ${empty ? emptyBlock() : rows}
  ${empty ? '' : `<div style="display:flex;padding:0 4px"><button class="a-fab" onclick="openAdd()">+</button></div>`}
  ${sheet ? `
  <div class="b-sheet">
    <div class="b-handle"></div>
    <div class="b-sheet-head">
      <h2>Thêm bài</h2>
      <p>Chọn từ iTunes hoặc tự nhập</p>
    </div>
    <div class="b-sheet-body">
      <div class="b-tabs">
        <button class="b-tab" data-on="${addTab==='itunes'?1:0}" onclick="setTab('itunes')">iTunes</button>
        <button class="b-tab" data-on="${addTab==='manual'?1:0}" onclick="setTab('manual')">Nhập tay</button>
      </div>
      ${addTab === 'itunes' ? `
        <input id="qq" placeholder="Tìm bài hát" value="${esc(query)}"
          style="width:100%;padding:11px 14px;border-radius:999px;background:#1c1c20;border:1px solid #2a2a30;outline:none;font-size:13.5px;margin-bottom:8px">
        ${SONGS.map(s => `
          <div class="b-result">
            <img src="${s.c}" alt="">
            <div class="a-meta"><div class="a-title">${esc(s.t)}</div><div class="a-artist">${esc(s.a)}</div></div>
            <button class="b-add">Lưu</button>
          </div>`).join('')}
      ` : `
        <input placeholder="Tên bài" style="width:100%;padding:11px 14px;border-radius:10px;background:#1c1c20;border:1px solid #2a2a30;outline:none;font-size:14px;margin-bottom:8px">
        <input placeholder="Ca sĩ" style="width:100%;padding:11px 14px;border-radius:10px;background:#1c1c20;border:1px solid #2a2a30;outline:none;font-size:14px;margin-bottom:8px">
        <input placeholder="URL ảnh bìa" style="width:100%;padding:11px 14px;border-radius:10px;background:#1c1c20;border:1px solid #2a2a30;outline:none;font-size:14px">
        <button style="margin-top:14px;width:100%;padding:12px;border-radius:10px;background:#ff6a4d;color:#1a0a06;font-weight:600;font-size:13px">Lưu bài</button>
      `}
    </div>
  </div>` : ''}`;
}

/* ---------- shared behaviour ---------- */
function render() {
  document.getElementById('app').innerHTML =
    variant === 'A' ? renderA()
    : variant === 'B' ? renderB()
    : variant === 'C' ? renderC()
    : renderD();
  document.getElementById('lbl').textContent = variant + ' · ' + NAMES[variant];
  document.getElementById('emptyToggle').style.opacity = empty ? '1' : '.45';
  const q = document.getElementById('q');
  if (q) {
    q.addEventListener('input', e => {
      query = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const n = document.getElementById('q');
      if (n) { n.focus(); n.setSelectionRange(pos, pos); }
    });
  }
  const qq = document.getElementById('qq');
  if (qq) qq.addEventListener('input', e => {
    query = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const n = document.getElementById('qq');
    if (n) { n.focus(); n.setSelectionRange(pos, pos); }
  });
}

function setVariant(v) {
  variant = v; sheet = false; query = '';
  const u = new URL(location.href);
  u.searchParams.set('variant', v);
  history.replaceState(null, '', u);
  render();
}
function setEmpty(v) {
  empty = v;
  const u = new URL(location.href);
  v ? u.searchParams.set('empty', '1') : u.searchParams.delete('empty');
  history.replaceState(null, '', u);
  render();
}
window.openAdd = () => { sheet = true; render(); };
window.closeAdd = () => { sheet = false; query = ''; render(); };
window.setTab = t => { addTab = t; render(); };
window.toggleView = () => { viewMode = viewMode === 'list' ? 'grid' : 'list'; render(); };

const keys = ['A','B','C','D'];
document.getElementById('prev').onclick = () => setVariant(keys[(keys.indexOf(variant) + 3) % 4]);
document.getElementById('next').onclick = () => setVariant(keys[(keys.indexOf(variant) + 1) % 4]);
document.getElementById('emptyToggle').onclick = () => setEmpty(!empty);
document.addEventListener('keydown', e => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  if (e.key === 'ArrowRight') document.getElementById('next').click();
  if (e.key === 'Escape') closeAdd();
});

render();
</script>
</body>
</html>
